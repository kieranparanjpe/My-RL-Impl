[project]
name = "my-rl-impl"
version = "0.1.0"
description = "Reinforcement learning implementations"
requires-python = ">=3.12"
dependencies = [
    "rl-commons @ git+https://github.com/kieranparanjpe/rl-commons.git",
    "gymnasium[box2d,mujoco]==1.3.0",
    "torch==2.12.0",
    "numpy==2.4.6",
    "matplotlib==3.10.9",
    "mujoco==3.8.1",
    "wandb==0.27.0",
    "pygame-ce==2.5.7",
    "seaborn==0.13.2",
    "moviepy==2.2.1",
    "pandas==3.0.3",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "tqdm==4.67.3",
    "sympy==1.14.0",
    "opencv-python==4.13.0.92",
    "PyOpenGL==3.1.10",
    "glfw==2.10.0",
    "gym-pusht==0.1.6",
    "pymunk<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = []
